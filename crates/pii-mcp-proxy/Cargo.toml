[package]
name = "pii-mcp-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Zero-trust STDIO JSON-RPC wrapper for Model Context Protocol (MCP) servers."

[[bin]]
name = "pii-mcp-proxy"
path = "src/main.rs"

[dependencies]
pii-core = { path = "../pii-core", version = "0.1.0" }
pii-store-redis = { path = "../pii-store-redis", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

[dev-dependencies]
pii-store-redis = { path = "../pii-store-redis", version = "0.1.0", features = ["test-support"] }
