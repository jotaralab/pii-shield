locale = "us"
name = "United States"

[[rules]]
id = "US_SSN"
tag_prefix = "US_SSN"
description = "United States Social Security Number"
regex = '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b'
validator = "us_ssn"
priority = 90
context_keywords = ["ssn", "social security", "taxpayer"]
valid_samples = ["123-45-6789", "219-09-9999"]
invalid_samples = ["000-12-3456", "666-12-3456", "900-12-3456", "123-00-6789", "123-45-0000"]

[[rules]]
id = "US_ITIN"
tag_prefix = "US_ITIN"
description = "Individual Taxpayer Identification Number (starts with 9)"
regex = '\b(?:9[0-9]{8}|9[0-9]{2}[ \-][0-9]{2}[ \-][0-9]{4})\b'
validator = "us_itin"
priority = 90
context_keywords = ["itin", "irs", "taxpayer"]
valid_samples = ["911-70-1234", "911 72 1000", "911701234"]
invalid_samples = ["811-70-1234", "911-49-1234", "911-50-0000", "911-701234", "911-70 1234", "911--70-1234"]

[[rules]]
id = "US_ROUTING_ABA"
tag_prefix = "US_ROUTING_ABA"
description = "ABA banking routing number (9 digits, Fed prefix + Mod 10)"
regex = '\b[0-9]{9}\b'
validator = "us_aba_routing"
priority = 96
context_keywords = ["routing", "aba", "transit", "ach", "bank"]
valid_samples = ["121000248", "021000021"]
invalid_samples = ["835030568", "121000249", "12100002-8"]

[[rules]]
id = "US_CA_DL"
tag_prefix = "US_CA_DL"
description = "California driver's license (context-gated, no checksum)"
regex = '\b[A-Z][0-9]{7}\b'
validator = "none"
priority = 75
require_context = true
context_keywords = ["driver", "license", "dl", "dmv", "california", "ca dl", "id card"]
valid_samples = ["A1234567", "F0192834", "D9876543"]
invalid_samples = ["A12345671", "3ABC4567", "A123-456"]

[[rules]]
id = "PHONE_US"
tag_prefix = "PHONE_US"
description = "United States NANP phone number"
regex = '(?:\+1[ ]*)?(?:\([2-9][0-9]{2}\)|[2-9][0-9]{2})[ \.\-]?[2-9][0-9]{2}[ \.\-]?[0-9]{4}\b'
validator = "e164_phone"
priority = 75
context_keywords = ["phone", "cell", "tel", "call"]
valid_samples = ["+1 (555) 234-5678", "555-234-5678", "(555) 234-5678"]
invalid_samples = ["123-45", "000-000-0000"]
