locale = "us"
name = "United States"

[[rules]]
id = "US_SSN"
tag_prefix = "US_SSN"
description = "United States Social Security Number"
regex = '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b'
validator = "us_ssn"
priority = 90
context_keywords = ["ssn", "social security", "taxpayer"]
valid_samples = ["123-45-6789", "219-09-9999"]
invalid_samples = ["000-12-3456", "666-12-3456", "900-12-3456", "123-00-6789", "123-45-0000"]

[[rules]]
id = "PHONE_US"
tag_prefix = "PHONE_US"
description = "United States NANP phone number"
regex = '(?:\+1\s*)?(?:\([2-9][0-9]{2}\)|[2-9][0-9]{2})[ \.\-]?[2-9][0-9]{2}[ \.\-]?[0-9]{4}\b'
validator = "e164_phone"
priority = 75
context_keywords = ["phone", "cell", "tel", "call"]
valid_samples = ["+1 (555) 234-5678", "555-234-5678", "(555) 234-5678"]
invalid_samples = ["123-45", "000-000-0000"]
