locale = "global"
name = "Global Standards"

[[rules]]
id = "EMAIL"
tag_prefix = "EMAIL"
description = "RFC 5322 compatible email address"
regex = '\b[a-zA-Z0-9._%+\-]+@[a-zA-Z0-9](?:[a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?)*\.[a-zA-Z]{2,}\b'
validator = "none"
priority = 100
valid_samples = ["user@example.com", "budi.santoso@gmail.com", "contact+test@company.co.id"]
invalid_samples = ["user@-invalid-.com", "@missing-local.com", "plainaddress"]

[[rules]]
id = "CREDIT_CARD"
tag_prefix = "CREDIT_CARD"
description = "Visa, Mastercard, Amex, Discover payment card numbers"
regex = '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12}|[0-9]{4}(?:[ \-][0-9]{4}){3}|[0-9]{13,19})\b'
validator = "luhn"
priority = 85
context_keywords = ["card", "credit", "visa", "mastercard", "pembayaran", "kartu"]
valid_samples = ["4532015112830366", "4532-0151-1283-0366", "5105105105105100"]
invalid_samples = ["4532015112830367", "4532--0151-1283-0366", "0000000000000"]
