[package]
name = "pii-store-redis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Valkey / Redis backed PiiVaultStore adapter for pii-shield multi-pod deployments."

[features]
# Exposes `test_support::MockValkey` to downstream E2E tests.
test-support = []

[dependencies]
pii-core = { path = "../pii-core" }
redis = { version = "0.27", default-features = false, features = ["acl"] }
