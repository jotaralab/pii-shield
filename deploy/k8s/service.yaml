apiVersion: v1
kind: Service
metadata:
  name: pii-server
  namespace: pii-shield
  labels:
    app.kubernetes.io/name: pii-shield
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pii-shield
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
