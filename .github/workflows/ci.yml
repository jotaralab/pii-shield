name: CI & Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Rust Test, Lint & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Unit Tests
        run: cargo test --workspace
      - name: Run Documentation Tests
        run: cargo test --doc
      - name: Build Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Run Benchmark Smoke Suite
        run: cargo test --workspace --benches
      - name: Verify Wasm Compilation
        run: cargo check -p pii-wasm --target wasm32-unknown-unknown
      - name: Run Foreign-Language C-ABI & Python E2E Tests
        run: |
          cargo build -p pii-ffi
          python3 tests/ffi_python_e2e.py
          gcc -Wall -Werror tests/c_abi_e2e.c -Ltarget/debug -lpii_ffi -Icrates/pii-ffi/include -Wl,-rpath,'$ORIGIN/target/debug',-rpath,$PWD/target/debug -o /tmp/c_abi_test
          /tmp/c_abi_test

  security-audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
