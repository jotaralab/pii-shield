name: CI & Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Rust Test, Lint & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Unit Tests
        run: cargo test --workspace
      - name: Run Documentation Tests
        run: cargo test --doc
      - name: Build Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Run Benchmark Smoke Suite
        run: cargo test --workspace --benches
      - name: Verify Wasm Compilation
        run: cargo check -p pii-wasm --target wasm32-unknown-unknown
      - name: Run Foreign-Language C-ABI & Python E2E Tests
        run: |
          cargo build -p pii-ffi
          python3 tests/ffi_python_e2e.py
          gcc -Wall -Wextra -Werror tests/c_abi_e2e.c -Ltarget/debug -lpii_ffi -Icrates/pii-ffi/include -Wl,-rpath,'$ORIGIN/target/debug',-rpath,$PWD/target/debug -o /tmp/c_abi_test
          /tmp/c_abi_test
      - name: Run Python SDK Unit Tests
        run: python3 -m unittest discover -s bindings/python/tests -v
      - name: Run Go SDK Tests
        run: |
          cd bindings/go
          go vet ./...
          go test -race -v ./...
      - name: Run Ruby SDK Tests
        run: |
          gem install ffi --no-document
          cd bindings/ruby
          ruby -Ilib:test test/test_pii_shield.rb
      - name: Run Elixir SDK Tests
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"
      - name: Elixir SDK mix compile & test
        run: |
          cd bindings/elixir
          mix compile
          mix test

  security-audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
